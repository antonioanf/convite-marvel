<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITULO%</title>
    <meta name="description" content="%DESCRICAO%" />
    <meta name="theme-color" content="%THEME%" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Prévia do link no WhatsApp / redes (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%URL%" />
    <meta property="og:title" content="%TITULO%" />
    <meta property="og:description" content="%DESCRICAO%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Convite de aniversário de %NOME%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/bangers.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/share-tech-mono.woff2" as="font" type="font/woff2" crossorigin />

    <style>%PALETA%</style>
    <script>
      // Decide antes da primeira pintura se mostramos a moldura de celular (desktop).
      ;(function () {
        var d = document.documentElement, framed
        try { framed = window.self !== window.top } catch (e) { framed = true }
        if (framed) d.classList.add('framed')
        if (!framed && window.matchMedia && matchMedia('(min-width: 820px) and (hover: hover) and (pointer: fine)').matches) d.classList.add('desk')
        else d.classList.add('locked', 'pre') // pre: a intro está na tela
      })()
    </script>
    <!-- CSS crítico: só o necessário para a intro aparecer instantaneamente -->
    <style>
      @font-face { font-family: 'Bangers'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/bangers.woff2) format('woff2'); }
      @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url(/fonts/nunito.woff2) format('woff2'); }
      @font-face { font-family: 'Share Tech Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/share-tech-mono.woff2) format('woff2'); }
      html { background: var(--color-ceu); color: var(--color-marinho); -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      html.desk #intro { display: none; }
      html.locked, html.locked body { overflow: hidden; }

      /* ---------- Intro: capa de gibi ---------- */
      .intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; touch-action: manipulation; }
      .intro:focus-visible { outline: none; }
      .intro:focus-visible .cv-cta span { outline: 4px solid var(--color-amarelo); outline-offset: 5px; }
      .cv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-sizing: border-box; overflow: hidden;
        padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); background: var(--color-azul); color: #fff; }
      /* raios de sol girando atrás do emblema (só transform) */
      .cv-rays { position: absolute; left: 50%; top: 52%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; pointer-events: none;
        background: repeating-conic-gradient(from 0deg, rgb(255 255 255 / .13) 0 7deg, transparent 7deg 15deg); animation: cv-spin 40s linear infinite; will-change: transform; }
      /* retícula */
      .cv-dots { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, rgb(11 31 77 / .28) 1.6px, transparent 2.1px) 0 0 / 12px 12px;
        -webkit-mask: radial-gradient(75% 60% at 50% 52%, transparent 30%, #000 75%); mask: radial-gradient(75% 60% at 50% 52%, transparent 30%, #000 75%); }
      @keyframes cv-spin { to { transform: rotate(360deg) } }

      .cv-mast { position: relative; margin-top: 4px; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
      /* faixa vermelha com as pontas azuis dobradas (como no convite impresso) */
      .cv-faixa { position: relative; width: 100%; height: clamp(104px, 31vw, 126px); transform: rotate(-2deg); }
      .cv-faixa svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .cv-faixa-txt { position: absolute; left: 12%; right: 12%; top: 2%; height: 78%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; text-align: center; }
      .cv-nome { display: block; font: 400 clamp(38px, 12.4vw, 56px)/.92 'Bangers', Impact, sans-serif; letter-spacing: .05em; color: #fff; white-space: nowrap;
        -webkit-text-stroke: 2px var(--color-marinho); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--color-marinho); }
      .cv-idade { display: block; margin-top: 2px; font: 400 clamp(20px, 6.2vw, 26px)/1 'Bangers', Impact, sans-serif; letter-spacing: .12em; color: var(--color-amarelo);
        -webkit-text-stroke: 1.5px var(--color-marinho); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--color-marinho); }
      .cv-hud { position: relative; margin: 16px 0 0; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
        background: var(--color-marinho); border: 2px solid var(--color-ciano); color: var(--color-ciano); font: 400 14px/1 'Share Tech Mono', ui-monospace, monospace; letter-spacing: .14em; }
      .cv-hud i { width: 9px; height: 9px; border-radius: 50%; background: var(--color-ciano); animation: cv-blink 1s steps(2, jump-none) infinite; }
      @keyframes cv-blink { 50% { opacity: .2 } }

      .cv-mid { position: relative; display: flex; flex-direction: column; align-items: center; gap: 34px; }
      .cv-balao { position: relative; margin: 0; padding: 10px 20px 12px; background: #fff; color: var(--color-marinho); border: 3px solid var(--color-marinho); border-radius: 26px;
        box-shadow: 4px 5px 0 var(--color-marinho); text-align: center; font: 400 clamp(32px, 10vw, 42px)/1 'Bangers', Impact, sans-serif; letter-spacing: .04em; transform: rotate(-2deg); }
      .cv-balao::before, .cv-balao::after { content: ''; position: absolute; left: 50%; width: 0; height: 0; border-style: solid; }
      .cv-balao::before { bottom: -22px; margin-left: -8px; border-width: 22px 6px 0 16px; border-color: var(--color-marinho) transparent transparent transparent; }
      .cv-balao::after { bottom: -14px; margin-left: -3px; border-width: 15px 4px 0 10px; border-color: #fff transparent transparent transparent; }
      .cv-emb { width: clamp(150px, 54vw, 230px); animation: cv-pulse 1.6s ease-in-out infinite; will-change: transform; }
      .cv-emb svg { display: block; width: 100%; height: auto; }
      @keyframes cv-pulse { 0%,100% { transform: scale(1) rotate(-3deg) } 50% { transform: scale(1.07) rotate(3deg) } }

      .cv-foot { position: relative; display: flex; flex-direction: column; align-items: center; }
      .cv-cta { margin: 0; }
      .cv-cta span { display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 26px; border-radius: 18px; box-sizing: border-box;
        background: var(--color-amarelo); color: var(--color-marinho); border: 3px solid var(--color-marinho); box-shadow: 0 6px 0 var(--color-marinho);
        font: 400 26px/1 'Bangers', Impact, sans-serif; letter-spacing: .06em; animation: cv-bounce 1.4s ease-in-out infinite; }
      @keyframes cv-bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .cv-date { margin: 14px 0 0; padding: 4px 12px; border-radius: 8px; background: var(--color-marinho); color: #fff;
        font: 400 15px/1.2 'Share Tech Mono', ui-monospace, monospace; letter-spacing: .28em; }

      /* POW! que estoura no meio quando a capa rasga */
      .cv-pow { position: absolute; left: 50%; top: 50%; width: 300px; margin: -110px 0 0 -150px; pointer-events: none; transform: scale(0); opacity: 0; z-index: 3; }
      .cv-pow svg { display: block; width: 100%; height: auto; }
      /* atrás da capa: céu de tempestade (nuvens pesadas + chuva na diagonal); some depois do raio */
      .cv-tempestade { position: absolute; inset: 0; overflow: hidden; display: none;
        background: radial-gradient(80% 45% at 30% 0%, #2A3566, transparent 70%), radial-gradient(70% 40% at 80% 6%, #232C57, transparent 70%),
          linear-gradient(180deg, #121A3A 0%, #1B2552 45%, #2B3A6E 100%); }
      .cv-tempestade::before { content: ''; position: absolute; left: -10%; right: -10%; top: -6%; height: 42%;
        background: radial-gradient(30% 60% at 15% 40%, #0B1230, transparent 70%), radial-gradient(28% 55% at 45% 30%, #0E163A, transparent 72%),
          radial-gradient(32% 60% at 78% 45%, #0A1130, transparent 70%), radial-gradient(40% 50% at 60% 80%, #1A2350, transparent 70%); }
      .cv-chuva { position: absolute; left: -30%; top: -30%; width: 160%; height: 160%; opacity: .55;
        background: repeating-linear-gradient(105deg, transparent 0 13px, rgb(170 205 255 / .5) 13px 14.2px, transparent 14.2px 31px) 0 0 / 31px 58px;
        will-change: transform; }
      .intro.is-open .cv-tempestade { display: block; }
      .intro.is-open .cv-chuva { animation: cv-chuva .32s linear infinite; }
      @keyframes cv-chuva { to { transform: translate(-15px, 58px) } }
      .intro.is-gone .cv-tempestade, .intro.is-gone .cv-raios { opacity: 0; transition: opacity .24s ease; }
      /* raios do rasgo (canvas 2D desenhado pelo intro.ts) e clarão azul-claro suave (nunca branco puro, opacidade ≤ 0,55) */
      .cv-raios { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; display: none; }
      .cv-flash { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(90% 70% at 50% 30%, #DCEEFF, #BFE3FF 60%, #8FC4F5); opacity: 0; }

      /* ---------- Abertura: a capa rasga ao meio (~0,55 s), só transform/opacity ---------- */
      .intro.is-open { cursor: default; pointer-events: none; }
      .intro.is-open .cv * { animation-play-state: paused; }
      .intro.is-open .cv-l { clip-path: polygon(0 0, 51% 0, 46% 7%, 54% 14%, 47% 22%, 53% 30%, 45% 38%, 52% 46%, 47% 54%, 55% 62%, 46% 70%, 53% 78%, 47% 86%, 52% 93%, 49% 100%, 0 100%);
        animation: cv-tear-l .5s .07s cubic-bezier(.55, 0, .8, .3) forwards; }
      .intro.is-open .cv-r { clip-path: polygon(51% 0, 100% 0, 100% 100%, 49% 100%, 52% 93%, 47% 86%, 53% 78%, 46% 70%, 55% 62%, 47% 54%, 52% 46%, 45% 38%, 53% 30%, 47% 22%, 54% 14%, 46% 7%);
        animation: cv-tear-r .5s .07s cubic-bezier(.55, 0, .8, .3) forwards; }
      @keyframes cv-tear-l { 0% { transform: none } 20% { transform: translateX(-2%) rotate(-1deg) } 65% { opacity: 1 } 100% { transform: translate(-112%, 14%) rotate(-18deg); opacity: 0 } }
      @keyframes cv-tear-r { 0% { transform: none } 20% { transform: translateX(2%) rotate(1deg) } 65% { opacity: 1 } 100% { transform: translate(112%, 14%) rotate(18deg); opacity: 0 } }
      .intro.is-open .cv-pow { animation: cv-pow .58s cubic-bezier(.2, .8, .3, 1.2) forwards; }
      @keyframes cv-pow { 0% { transform: scale(.2) rotate(-12deg); opacity: 1 } 35% { transform: scale(1.12) rotate(4deg); opacity: 1 } 70% { transform: scale(1) rotate(0); opacity: 1 } 100% { transform: scale(1.3); opacity: 0 } }

      /* menos movimento: sem rasgo, a capa só esmaece e o POW aparece parado */
      .intro.is-open.rm .cv { clip-path: none; animation: none; opacity: 0; transition: opacity .25s ease; }
      .intro.is-open.rm .cv-pow { animation: none; transform: scale(1); opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .intro *, .intro *::before, .intro *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
      @media (max-height: 640px) {
        .cv-mid { gap: 18px; }
        .cv-emb { width: 130px; }
        .cv-hud { margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" role="button" tabindex="0" aria-label="Abrir o convite de aniversário de %NOME%: você foi convocado para a %EQUIPE%!">
      <div class="cv-tempestade" aria-hidden="true"><div class="cv-chuva"></div></div>
      <div class="cv cv-l">
        <div class="cv-rays" aria-hidden="true"></div>
        <div class="cv-dots" aria-hidden="true"></div>
        <div class="cv-mast" aria-hidden="true">
          <div class="cv-faixa">
            <svg viewBox="0 0 400 120" preserveAspectRatio="none">
              <polygon points="0,34 74,34 74,116 0,116 24,75" fill="var(--color-azul)" stroke="var(--color-marinho)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
              <polygon points="400,34 326,34 326,116 400,116 376,75" fill="var(--color-azul)" stroke="var(--color-marinho)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
              <polygon points="44,98 74,116 74,98" fill="var(--color-marinho)" />
              <polygon points="356,98 326,116 326,98" fill="var(--color-marinho)" />
              <rect x="50" y="10" width="306" height="88" fill="var(--color-marinho)" />
              <rect x="44" y="4" width="312" height="94" fill="var(--color-vermelho)" stroke="var(--color-marinho)" stroke-width="3" vector-effect="non-scaling-stroke" />
            </svg>
            <p class="cv-faixa-txt"><span class="cv-nome">%NOME_CAIXA%</span><span class="cv-idade">· %IDADE% ANOS ·</span></p>
          </div>
          <p class="cv-hud"><i></i>CHAMADO DA %EQUIPE%</p>
        </div>
        <div class="cv-mid" aria-hidden="true">
          <p class="cv-balao">Você foi<br />convocado!</p>
          <div class="cv-emb">%EMBLEMA%</div>
        </div>
        <div class="cv-foot" aria-hidden="true">
          <p class="cv-cta">
            <span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z" /></svg>
              Toque para abrir
            </span>
          </p>
          <p class="cv-date">%DATA_CURTA%</p>
        </div>
      </div>
      <canvas class="cv-raios" aria-hidden="true"></canvas>
      <div class="cv-flash" aria-hidden="true"></div>
      <div class="cv-pow" aria-hidden="true">%POW%</div>
    </div>
    <div id="root"></div>
    <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para ver o convite de %NOME% ⚡</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
